name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        laravel: ['12', '13']
    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, gd, intl, fileinfo
          coverage: none
      - run: composer require "laravel/framework:^${{ matrix.laravel }}.0" --dev --no-update --no-interaction
      - run: composer update --no-interaction --prefer-dist --no-progress -W
      - run: vendor/bin/pest
